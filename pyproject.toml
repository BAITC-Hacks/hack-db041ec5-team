[project]
name = "moneygraph"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "pandas>=2.3,<3", "numpy>=2.3,<3", "scipy>=1.16,<2", "networkx>=3.5,<4",
  "pyarrow>=23,<26", "PyYAML>=6,<7", "openai>=2,<4", "python-dotenv>=1,<2",
  "itsdangerous>=2.2,<3", "jsonschema>=4,<5"
]

[tool.vercel]
entrypoint = "api.index:app"
